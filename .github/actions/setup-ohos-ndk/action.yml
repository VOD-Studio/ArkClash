name: 准备 OpenHarmony NDK
description: 从公开的 OpenHarmony SDK 取出 Linux 版 NDK（编内核用，不需要华为账号），按版本缓存，并设置 OHOS_SDK
inputs:
  release:
    description: OpenHarmony 发行版目录，如 7.0-Release
    required: true
  member:
    description: SDK 压缩包里 Linux NDK 的路径
    required: true
runs:
  using: composite
  steps:
    - id: dir
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
      run: echo "path=$RUNNER_TOOL_CACHE/ohos-ndk/$RELEASE" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.dir.outputs.path }}
        key: ohos-ndk-${{ runner.os }}-${{ inputs.release }}-${{ inputs.member }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        MEMBER: ${{ inputs.member }}
        OUT: ${{ steps.dir.outputs.path }}
      run: scripts/ci/fetch-ohos-ndk.sh "$RELEASE" "$MEMBER" "$OUT"
    - shell: bash
      env:
        OUT: ${{ steps.dir.outputs.path }}
      run: echo "OHOS_SDK=$OUT" >> "$GITHUB_ENV"
