name: Website

# 官网与文档站点（website/）：PR 上执行同步、类型检查与静态构建；合并到 main 后自动部署到 GitHub Pages。
on:
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "GLOSSARY.md"
      - ".release-please-manifest.json"
      - ".go-version"
      - "entry/src/main/resources/base/media/svc_*.svg"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "GLOSSARY.md"
      - ".release-please-manifest.json"
      - ".go-version"
      - "entry/src/main/resources/base/media/svc_*.svg"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  # PR 取消旧运行；生产部署排队执行，不中途打断正在发布的 Pages。
  group: website-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 构建官网与文档
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Check types and content
        working-directory: website
        run: bun run check

      - name: Build static site
        working-directory: website
        env:
          # 非 PR 场景由 configure-pages 注入真实 origin 与 base_path（自定义域名时 base_path 为空串）。
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
