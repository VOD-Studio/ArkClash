name: Release

# 为一个已存在的 Release 构建并上传产物。只构建一次：release 模式的 HAP 加上维护者的调试证书签名，
# 同一次构建同时得到未签名包（给其他人用自己的证书签名）和调试签名包（只能装在证书里登记过的设备上），
# 两者内容一致。构建不用缓存；上传时附上来源证明，任何人都能验证安装包出自本仓库的这个 tag。
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      HARMONYOS_TOOLS_TOKEN:
        required: true
      HARMONYOS_SIGNING_BUNDLE:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 要补传产物的 Release tag，如 v0.2.0
        required: true
      dry-run:
        description: 只构建和生成校验和，不上传、不生成来源证明
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    uses: ./.github/workflows/core.yml
    with:
      ref: ${{ inputs.tag }}
      fresh: true

  hap:
    needs: core
    uses: ./.github/workflows/hap.yml
    with:
      ref: ${{ inputs.tag }}
      mode: release
      retention-days: 30
      fresh: true
    secrets:
      HARMONYOS_TOOLS_TOKEN: ${{ secrets.HARMONYOS_TOOLS_TOKEN }}
      HARMONYOS_SIGNING_BUNDLE: ${{ secrets.HARMONYOS_SIGNING_BUNDLE }}

  publish:
    name: 发布
    needs: hap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只有这个任务能写 Release；构建任务都是只读的。
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry-run || false }}
    steps:
      # 发布脚本用当前分支的版本，补传旧 tag 时也能用上发布流程的修复；安装包本身来自 tag。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hap-release
          path: dist
      - run: scripts/ci/publish-release.sh prepare "$TAG"
      - if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*.hap
      - if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/publish-release.sh upload "$TAG"
