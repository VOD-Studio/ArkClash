name: Release

# 为一个已存在的 Release 构建并上传产物：未签名的 HAP（给其他人自行签名安装），
# 以及配置了 HARMONYOS_SIGNING_BUNDLE 时用维护者调试证书签名的 HAP（只能装在证书里登记过的设备上）。
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 要补传产物的 Release tag，如 v0.2.0
        required: true

permissions:
  contents: write

jobs:
  core:
    uses: ./.github/workflows/core.yml
    with:
      ref: ${{ inputs.tag }}
    permissions:
      contents: read

  hap:
    name: HAP
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag }}
      HAS_SIGNING: ${{ secrets.HARMONYOS_SIGNING_BUNDLE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libclash
          path: entry/libs/arm64-v8a
      - uses: ./.github/actions/setup-harmonyos-tools
        with:
          repo: ${{ vars.HARMONYOS_TOOLS_REPO }}
          tag: ${{ vars.HARMONYOS_TOOLS_TAG }}
          token: ${{ secrets.HARMONYOS_TOOLS_TOKEN }}
      - run: make geodata
      - run: make hap MODE=release
      - name: 调试签名包
        if: env.HAS_SIGNING == 'true'
        env:
          HARMONYOS_SIGNING_BUNDLE: ${{ secrets.HARMONYOS_SIGNING_BUNDLE }}
        run: |
          scripts/ci/setup-signing.sh "$RUNNER_TEMP/signing"
          make hap MODE=debug
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/publish-release.sh "$TAG"
