name: Release

# 为一个已存在的 Release 构建并上传产物。只构建一次：release 模式的 HAP 加上维护者的调试证书签名，
# 同一次构建同时得到未签名包（给其他人用自己的证书签名）和调试签名包（只能装在证书里登记过的设备上），
# 两者内容一致。构建不用缓存；上传时附上来源证明，任何人都能验证安装包出自本仓库的这个 tag。
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      HARMONYOS_TOOLS_TOKEN:
        required: true
      HARMONYOS_SIGNING_BUNDLE:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 要补传产物的 Release tag，如 v0.2.0
        required: true
      dry-run:
        description: 只构建和生成校验和，不上传、不生成来源证明
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # 补传时要在 tag 本身上运行（Actions 页面的「Use workflow from」选这个 tag），
  # 这样 workflow、action、脚本和代码都来自同一个提交，不会因为后来改了 CI 而对不上。
  # dry-run 可以在任意分支上运行，用来测试发版流程。
  check:
    name: 检查触发方式
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          REF: ${{ github.ref }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ "$DRY_RUN" != "true" && "$REF" != "refs/tags/$TAG" ]]; then
            echo "::error::补传 $TAG 时，「Use workflow from」要选 $TAG 本身（现在是 ${REF}）"
            exit 1
          fi

  core:
    needs: check
    # 被 release-please 调用时 check 会跳过，照常构建。
    if: ${{ !cancelled() && needs.check.result != 'failure' }}
    uses: ./.github/workflows/core.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.tag }}
      fresh: true

  hap:
    needs: core
    # check 的跳过会沿依赖链传播，HAP 和发布都要覆盖隐式 success()。
    if: ${{ !cancelled() && needs.core.result == 'success' }}
    uses: ./.github/workflows/hap.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.tag }}
      mode: release
      retention-days: 30
      fresh: true
    secrets:
      HARMONYOS_TOOLS_TOKEN: ${{ secrets.HARMONYOS_TOOLS_TOKEN }}
      HARMONYOS_SIGNING_BUNDLE: ${{ secrets.HARMONYOS_SIGNING_BUNDLE }}

  publish:
    name: 发布
    needs: hap
    if: ${{ !cancelled() && needs.hap.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只有这个任务能写 Release；构建任务都是只读的。
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry-run || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hap-release
          path: dist
      - run: scripts/ci/publish-release.sh prepare "$TAG"
      - if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*.hap
      - if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/publish-release.sh upload "$TAG"
