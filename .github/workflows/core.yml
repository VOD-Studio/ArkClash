name: Core

# 编译内核（libclash.so）并上传为 artifact，供 CI、发版和每周任务复用。
# 用公开的 OpenHarmony NDK，不依赖任何 secret，外部 fork 和 dependabot 的 PR 也能跑。
on:
  workflow_call:
    inputs:
      ref:
        description: 要构建的 git ref，留空为触发事件的 ref
        type: string
        default: ""
      fresh:
        description: 不用缓存。发版要求干净构建；每周任务用它提前发现下载地址、工具链的变化
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    name: 内核
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-core-toolchain
        with:
          fresh: ${{ inputs.fresh }}
      - run: make core
      - run: make lint CHECKS=go
      - name: 摘要
        run: |
          {
            echo "### 内核"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| Go | $(go env GOVERSION) |"
            echo "| mihomo | $(cd core && go list -m -f '{{.Version}}' github.com/metacubex/mihomo) |"
            echo "| libclash.so | $(du -h entry/libs/arm64-v8a/libclash.so | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libclash
          path: entry/libs/arm64-v8a/libclash.so
          retention-days: 7
          if-no-files-found: error
