name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    uses: ./.github/workflows/core.yml
    with:
      lint: true

  hap:
    name: HAP
    needs: core
    # 依赖私有的 Command Line Tools：没配置的 fork、拿不到 secret 的 dependabot 和外部 PR 跳过。
    if: >-
      vars.HARMONYOS_TOOLS_REPO != '' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libclash
          path: entry/libs/arm64-v8a
      - uses: ./.github/actions/setup-harmonyos-tools
        with:
          repo: ${{ vars.HARMONYOS_TOOLS_REPO }}
          tag: ${{ vars.HARMONYOS_TOOLS_TAG }}
          token: ${{ secrets.HARMONYOS_TOOLS_TOKEN }}
      - run: make lint CHECKS=arkts
      - run: make geodata
      - run: make hap MODE=debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hap-debug-unsigned
          path: dist/*.hap
          retention-days: 7
          if-no-files-found: error
