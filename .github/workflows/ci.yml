name: CI

# 分层设计见 docs/ci.md：变更范围 → 快速检查、内核 → HAP，最后由「CI 通过」汇总。
# main 的合并规则只要求「CI 通过」一个检查，任务增减不用改规则。
on:
  pull_request:
  push:
    branches: [main]
  # 机器人开的 PR（发版、Geo 数据）用 GITHUB_TOKEN 创建，不会触发 pull_request，
  # 由它们的 workflow 手动触发这里，检查结果同样挂在 PR 的最新提交上。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR 上新的推送取消旧的运行；main 上每个提交都要跑完，按提交分组。
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
      deps: ${{ steps.changes.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 scripts/ci/changes.py | tee -a "$GITHUB_OUTPUT"

  checks:
    name: 快速检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          scripts/ci/install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: 检查
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # zizmor 联网核对 action 固定的 SHA 是否真的属于对应仓库。
          GH_TOKEN: ${{ github.token }}
        run: |
          checks=(shell arch actions)
          # 提交信息只在 PR 上查：main 只能通过 PR 合并，这些提交已经查过。
          if [[ -n "$BASE" ]]; then
            checks+=(commits)
            export COMMIT_RANGE="$BASE..$HEAD"
          fi
          make lint CHECKS="${checks[*]}"

  core:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/core.yml

  hap:
    needs: [changes, core]
    # 外部 fork 的 PR 拿不到私有 Command Line Tools 的 token，跳过；合并后 main 上会补跑。
    if: >-
      needs.changes.outputs.build == 'true' &&
      vars.HARMONYOS_TOOLS_REPO != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/hap.yml
    with:
      mode: debug
      lint: true
      # main 上的包保留更久：维护者可以直接下载最新的签名包装机。
      retention-days: ${{ github.event_name == 'push' && 14 || 7 }}
      save-baseline: ${{ github.event_name == 'push' }}
    secrets:
      HARMONYOS_TOOLS_TOKEN: ${{ secrets.HARMONYOS_TOOLS_TOKEN }}
      HARMONYOS_SIGNING_BUNDLE: ${{ secrets.HARMONYOS_SIGNING_BUNDLE }}

  # 改了 Go 依赖的 PR 扫描依赖漏洞。现有依赖还有已知漏洞没修，暂时不计入「CI 通过」，
  # 修完后加进下面的 needs，改为必需。每周任务也会全量扫描一次。
  vuln:
    name: 依赖漏洞
    needs: changes
    if: needs.changes.outputs.deps == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-core-toolchain
      - run: make lint CHECKS=vuln

  ci-ok:
    name: CI 通过
    if: always()
    needs: [changes, checks, core, hap]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          # skipped 是按设计跳过（只改文档、外部 fork 的 PR），failure 和 cancelled 才算没通过。
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<<"$RESULTS" >/dev/null; then
            exit 1
          fi
